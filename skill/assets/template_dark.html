<!--
  模板：暗黑判决风 (Dark)
  适用：重磅爆料、组织腐败、大厂黑幕、严重翻车事件
  特征：黑底(#0a0a0a)、金色判词(#ffd700)、红色引用条(#e94560)、压抑氛围

  样式规范（dark 风格颜色值）:
  背景 #0a0a0a (纯黑)
  容器 #0f0f0f / #16213e (暗蓝)
  主文字 #ccc / #e8e8e8
  引用条 #e94560 (血红)
  引用底 #16213e (暗蓝)
  判词底 #0f0f0f + 金字 #ffd700
  标签底 #1a1a2e + 红字 #e94560
  医学框 #1a1a2e 底 / #e94560 边
  原文链接 #e94560

  article.json 中 "template": "dark" 即使用此风格。
  生成逻辑同 classic，仅颜色/氛围不同。
-->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
</head>
<body>
<section style="font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a0a0a;padding:20px;border-radius:8px;">

  <img src="data:image/jpeg;base64,{{COVER_B64}}" style="width:100%;border-radius:8px;display:block;margin:4px 0 6px;">

  <h1 style="font-size:22px;font-weight:700;color:#e8e8e8;line-height:1.4;margin:0 0 6px;">{{TITLE}}</h1>

  <p style="font-size:13px;color:#999;line-height:1.6;margin:0 0 14px;"><b style="color:#ff6b6b;">{{AUTHOR}}</b> · 原创评论 &nbsp;|&nbsp; {{DATE}}</p>

  <p style="font-size:17px;line-height:1.8;color:#aaa;margin:0 0 18px;">{{LEAD}}</p>

  <p style="display:inline-block;background:#1a1a2e;color:#e94560;font-size:13px;font-weight:700;padding:2px 8px;border-radius:4px;margin:6px 0 10px;">[真相翻译官]</p>
  <p style="font-size:17px;line-height:1.8;color:#ccc;margin:0 0 18px;">{{VERDICT}}</p>

  <!-- 毒舌深拆解（循环 sections） -->
  <h3 style="font-size:18px;font-weight:700;color:#e8e8e8;line-height:1.5;margin:22px 0 10px;">① 小标题</h3>
  <p style="border-left:4px solid #e94560;background:#16213e;padding:10px 14px;margin:0 0 10px;font-size:15px;color:#999;border-radius:0 6px 6px 0;line-height:1.7;">原文摘录："..."</p>
  <p style="font-size:17px;line-height:1.8;color:#ccc;margin:0 0 18px;">点评：...</p>

  <!-- 最后的判词（黑底金字） -->
  <section style="background:#0f0f0f;color:#ffd700;padding:16px 18px;border-radius:8px;margin:10px 0 20px;font-size:16px;line-height:1.75;border:1px solid #333;">
    <b style="color:#ffd700;font-weight:700;">[最后的判词]</b><br>
    判词正文...
  </section>

  <!-- 版权声明 -->
  <p style="font-size:12px;color:#555;line-height:1.7;border-top:1px solid #222;padding-top:14px;margin-top:10px;">本文为「毒舌职场真相官」专栏评论文章。© 2026 毒舌职场真相官</p>

  <!-- 原文来源 -->
  <section style="font-size:13px;color:#777;line-height:1.7;border-top:1px solid #222;margin-top:6px;padding-top:14px;">
    <p style="color:#555;font-size:12px;margin:0 0 8px;">原文来源 · 点击阅读原文（尊重版权）</p>
    <a style="display:inline-block;color:#e94560;text-decoration:none;word-break:break-all;background:#16213e;padding:8px 12px;border-radius:6px;font-size:13px;line-height:1.6;" href="{{SOURCE_URL}}" target="_blank" rel="noopener">原文链接</a>
    <p style="margin-top:8px;color:#555;font-size:12px;">本文为独立评论文章，版权归原作者及首发媒体所有。</p>
  </section>

</section>
</body>
</html>
